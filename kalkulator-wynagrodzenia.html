<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator wynagrodzenia</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #8f8e8e;
        margin: 0;
        padding: 20px 12px;
    }

    table {
        width: min(100%, 760px);
        margin: 0 auto;
        border-collapse: collapse;
        background: #fff;
    }

    th, td {
        padding: 10px 8px;
        text-align: center;
        border: 1px solid #ddd;
        width: auto;
    }

    th {
        background-color: #4CAF50;
        color: white;
    }

    input,
    button {
        width: 100%;
        max-width: 100%;
        min-height: 42px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #cfcfcf;
        padding: 8px 10px;
    }

    button {
        background-color: #4CAF50;
        color: white;
        border: none;
        cursor: pointer;
    }

    h1 {
        margin: 12px 0 0;
        font-size: clamp(1.2rem, 4vw, 2rem);
    }

    @media (max-width: 480px) {
        body {
            padding: 10px 8px;
        }

        table {
            width: 100%;
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        th, td {
            min-width: 100px;
            padding: 8px 6px;
        }
    }
</style>
</head>
<body>
    <table>
        <tr>
            <th>Zarobki:</th>
            <th>Całość netto</th>
            <th>Gotówka</th>
        </tr>
        <tr>
            <td>Uber</td>
            <td><input type="number" value="0" id="uber_total"></td>
            <td><input type="number" value="0" id="uber_cash"></td>
        </tr>
        <tr>
            <td>Bolt</td>
            <td><input type="number" value="0" id="bolt_total"></td>
            <td><input type="number" value="0" id="bolt_cash"></td>
        </tr>
        <tr>
            <td>FreeNow</td>
            <td><input type="number" value="0" id="freenow_total"></td>
            <td><input type="number" value="0" id="freenow_cash"></td>
        </tr>
        <tr>
            <td colspan="3">
                <p>Potrącenia dodatkowe:</p>
                <input type="number" value="22" id="additional_tax">
            </td>
        </tr>
        <tr>
            <td colspan="3">
                <button onclick="calculateTotal()">Oblicz</button>
                <h1>Wynagrodzenie: <span id="total">0</span> zł</h1>
            </td>
        </tr>
        
    </table>
    <script>
        function calculateTotal() {
            const uberTotal = parseFloat(document.getElementById('uber_total').value) || 0;
            const uberCash = parseFloat(document.getElementById('uber_cash').value) || 0;
            const boltTotal = parseFloat(document.getElementById('bolt_total').value) || 0;
            const boltCash = parseFloat(document.getElementById('bolt_cash').value) || 0;
            const freenowTotal = parseFloat(document.getElementById('freenow_total').value) || 0;
            const freenowCash = parseFloat(document.getElementById('freenow_cash').value) || 0;
            const additionalTax = parseFloat(document.getElementById('additional_tax').value) || 0;

            const total_before_tax = uberTotal + boltTotal + freenowTotal;
            const total_cash_included = (total_before_tax / 2) - additionalTax;
            const total = total_cash_included - (uberCash + boltCash + freenowCash);

            document.getElementById('total').textContent = total.toFixed(2);
        }
    </script>
</body>
</html>
